<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Gallery</title>
<meta name="description" content="One hundred small front-end projects, each with a live demo and source code.">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<main class="app">
  <header class="head">
    <div>
      <p class="eyebrow">Plain HTML, CSS and JavaScript</p>
      <h1>Project Gallery</h1>
      <p class="lede">One hundred small builds. Every one has a live demo and its own repository, no frameworks and no build step.</p>
    </div>
    <div class="stat">
      <span id="total">100</span>
      <small>projects</small>
    </div>
  </header>

  <div class="controls">
    <input type="search" id="search" placeholder="Search projects" aria-label="Search projects">
    <div class="chips" id="chips"></div>
  </div>

  <p class="count" id="count">Showing 100 of 100</p>

  <section class="grid" id="grid"></section>
  <p class="empty" id="empty" hidden>Nothing matches that search.</p>

  <footer class="foot">
    <p id="year">—</p>
    <p>Built and hosted with GitHub Pages.</p>
  </footer>
</main>
<script src="script.js"></script>
</body>
</html>
